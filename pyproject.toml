[project]
name = "soloist-bot"
version = "0.1.0"
description = "Discord music bot that plays the real Spotify catalog via Spotify Soloist"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "discord.py>=2.4.0",
    "aiohttp>=3.9",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "PyNaCl>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
soloist-bot = "bot.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
